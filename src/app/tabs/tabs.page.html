<ion-tabs>

  <ion-tab-bar slot="bottom" class="custom-tab-bar">

    <!-- Primary Tab: Live Telemetry -->
    <ion-tab-button tab="telemetry" href="/tabs/telemetry" aria-label="Live Telemetry">
      <ion-icon name="pulse-outline"></ion-icon>
      <ion-label>Live Telemetry</ion-label>
    </ion-tab-button>

    <!-- Secondary Tab: Live Route Map -->
    <ion-tab-button tab="map" href="/tabs/map" aria-label="Live Route Map">
      <ion-icon name="map-outline"></ion-icon>
      <ion-label>Live Map</ion-label>
    </ion-tab-button>

    <!-- Tab 3: Settings / Preferences -->
    <ion-tab-button tab="settings" href="/tabs/settings" aria-label="Preferences">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Preferences</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
