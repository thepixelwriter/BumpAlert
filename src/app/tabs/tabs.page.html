<ion-tabs>

  <ion-tab-bar slot="bottom" class="custom-tab-bar">

    <!-- Primary navigation destinations -->
    <ion-tab-button tab="map" href="/tabs/map" aria-label="Map & Navigation">
      <ion-icon name="navigate-circle-outline"></ion-icon>
      <ion-label>Navigate</ion-label>
    </ion-tab-button>

    <!-- Review reported road hazards -->
    <ion-tab-button tab="review" href="/tabs/review" aria-label="Hazard reports">
      <ion-icon name="layers-outline"></ion-icon>
      <ion-label>Reports</ion-label>
    </ion-tab-button>

    <!-- App preferences -->
    <ion-tab-button tab="settings" href="/tabs/settings" aria-label="Settings">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
