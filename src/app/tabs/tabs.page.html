<ion-tabs>

  <ion-tab-bar slot="bottom" class="custom-tab-bar">

    <!-- Tab 1: Map (default, first) — no label -->
    <ion-tab-button tab="map" href="/tabs/map" aria-label="Map & Navigation">
      <ion-icon name="navigate-circle-outline"></ion-icon>
    </ion-tab-button>

    <!-- Tab 2: Telemetry Review — no label -->
    <ion-tab-button tab="review" href="/tabs/review" aria-label="Telemetry Review">
      <ion-icon name="layers-outline"></ion-icon>
    </ion-tab-button>

    <!-- Tab 3: Settings — no label -->
    <ion-tab-button tab="settings" href="/tabs/settings" aria-label="Settings">
      <ion-icon name="settings-outline"></ion-icon>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
